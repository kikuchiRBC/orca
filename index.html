document.addEventListener('DOMContentLoaded', () => {
  // コンテナを指定
  const section = document.querySelector('.bubble-background');

  // 泡を生成する関数
  const createBubble = () => {
    const bubbleEl = document.createElement('span');
    bubbleEl.className = 'bubble';
    const minSize = 10;
    const maxSize = 50;
    const size = Math.random() * (maxSize + 1 - minSize) + minSize;
    bubbleEl.style.width = `${size}px`;
    bubbleEl.style.height = `${size}px`;
    bubbleEl.style.left = Math.random() * innerWidth + 'px';
    section.appendChild(bubbleEl);

    // 一定時間が経てば泡を消す
    setTimeout(() => {
      bubbleEl.remove();
    }, 8000);
  }

  // 泡の生成を開始するトリガー（初期値はOFF）
  let activeBubble = null;

  // 泡の生成をストップする関数
  const stopBubble = () => {
    clearInterval(activeBubble);
  };

  // Intersection observerに渡すコールバック関数
  const cb = (entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting) {
        activeBubble = setInterval(createBubble, 300);
      } else {
        stopBubble();
      }
    })
  };

  // Intersection observerに渡すオプション
  const options = {
    rootMargin: "100px 0px"
  }

  // Intersection observerの初期化
  const io = new IntersectionObserver(cb, options);
  io.POLL_INTERVAL = 100; // Polyfill
  io.observe(section);
});

      <h2>🏆 TRUE END 🏆</h2>

      <img src="images/orca_king.png" width="350">

      <p>✨シャチは伝説のシャチへ進化した！✨</p>
      <p>みんなに愛される海の王者になりました。</p>

      <p>最終スコア: ${score}</p>
      <p>幸せ度: ${happiness}</p>

      <button onclick="resetGame()">
        もう一度遊ぶ
      </button>
    `;

    return;
  }

  updateOrcaImage();

  // ゲーム中
  if (index < questions.length && happiness > 0) {

    const q = questions[index];

    game.innerHTML = `
      <h2>${q.question}</h2>

      ${q.options.map(opt =>
        `<button onclick="answer('${opt}')">${opt}</button>`
      ).join("")}

      <p>😊 幸せ度: ${happiness} ⭐ ポイント: ${score}</p>

      <div>

      ${score >= 10 ? `
      <button onclick="feedOrca(
        10,50,'🐟 小魚（-10pt）','images/smallfish.png'
      )">
      🐟 小魚
      </button>
      ` : ""}

      ${score >= 20 ? `
      <button onclick="feedOrca(
        20,130,'🍣 サーモン（-20pt）','images/salmon.png'
      )">
      🍣 サーモン
      </button>
      ` : ""}

      ${score >= 30 ? `
      <button onclick="feedOrca(
        30,200,'🐟 マグロ（-30pt）','images/tuna.png'
      )">
      🐟 マグロ
      </button>
      ` : ""}

      </div>

      <p id="result" style="font-size:30px;font-weight:bold;">
        ${resultMessage}
      </p>
    `;

  } else {

    let message = "";

    if (happiness <= 0) {
      message = "💔 シャチの幸せ度が0になってしまいました...";
    } else {
      message = "🎉 すべての問題をクリア！";
    }

    game.innerHTML = `
      <h2>ゲーム終了！</h2>

      <p>${message}</p>

      <p>最終スコア: ${score}</p>
      <p>幸せ度: ${happiness}</p>

      <button onclick="resetGame()">
        もう一度遊ぶ
      </button>
    `;
  }
}

function feedOrca(cost, heal, foodName, imageFile) {

  if (score < cost) return;

  score -= cost;
  happiness += heal;

  if (happiness > 1000) happiness = 1000;

  resultMessage =
    `${foodName}を食べた！😊 幸福度 +${heal}`;

  const food = document.getElementById("foodImage");

  food.src = imageFile;
  food.style.display = "block";
  food.style.top = "180px";
  food.style.opacity = "1";

  setTimeout(() => {
    food.style.top = "120px";
    food.style.opacity = "0";
  }, 50);

  setTimeout(() => {
    food.style.display = "none";
  }, 1000);

  render();
}
function shuffleQuestions() {
  for (let i = questions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));

    [questions[i], questions[j]] =
    [questions[j], questions[i]];
  }
}
let resultMessage = "";
function answer(option) {
  const q = questions[index];

  if (option === q.answer) {
    score++;
    happiness += 10;
    resultMessage = "⭕ 正解！";
  } else {
    happiness -= 10;
    resultMessage = "❌ ざんねん！ 正解は「" + q.answer + "」";
  }

  index++;

  setTimeout(() => {
    render();
  }, 1000);

  render();
}

function checkAnswer(selectedAnswer) {
  if (selectedAnswer === questions[currentQuestion].answer) {
    score++;

    document.getElementById("result").textContent = "⭕ 正解！";
    document.getElementById("result").style.color = "green";

  } else {

    document.getElementById("result").textContent =
      "❌ ざんねん！ 正解は「" + questions[currentQuestion].answer + "」";
    document.getElementById("result").style.color = "red";
  }

  // 1.5秒後に次の問題へ
  setTimeout(() => {
    currentQuestion++;
    showQuestion();
  }, 1500);
}
function resetGame() {
  index = 0;
  score = 0;
  happiness = 50;

  shuffleQuestions(); // 問題を再シャッフル

  render();
}



shuffleQuestions();

render();
</script>

</body>
</html>
